name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-26 → Xcode 26 → Swift 6.3.x, matching the developer toolchain.
    # macos-15's Swift 6.1.2 had over-eager region-based-isolation diagnostics
    # (false-positive "sending 'self' risks causing data races" on @MainActor
    # Sendable types, e.g. AppViewModel's detached pipeline tasks) that Swift 6.2
    # relaxed. It fails to build correct code that Xcode 26 accepts. The Swift
    # version guard below fails fast if the runner ever regresses.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: |
          swift --version
          # This package builds under Swift 6.2+ (Xcode 26+). Fail fast and
          # legibly if the runner regresses to an older toolchain, whose
          # region-isolation false-positives would otherwise surface as a wall
          # of confusing "sending 'self'" build errors.
          swift --version 2>&1 | grep -qE "Swift version (6\.[2-9]|[7-9]\.)" \
            || { echo "::error::Need Swift 6.2+ (Xcode 26+); this runner has an older toolchain"; exit 1; }

      # GoldenRecordingRegressionTests skips silently if its fixture is absent,
      # which would let the suite "pass" vacuously (README advertises this
      # regression). Fail CI if the committed fixture ever goes missing.
      - name: Assert golden fixture is present
        run: |
          test -f Tests/BCIEEGTests/Fixtures/reference_pipeline.json \
            || { echo "::error::Golden fixture missing — GoldenRecordingRegressionTests would skip vacuously"; exit 1; }

      # Compiles every target (incl. BCILLM's MLX Metal kernels via the runner's
      # full Xcode) — the primary gate that the whole graph builds.
      - name: Build (all targets)
        run: swift build

      # Run the deterministic stub/mock/pure suites only: headless runners have
      # no GPU (so MLX .eval() would fault), no `claude` CLI (network egress),
      # no Core ML models, and no live EEG hardware. BCIEEGTests includes the
      # golden-recording + BGE-replay regressions against the committed fixtures.
      # The MLX-eval, egress-smoke, and hardware paths stay local-only.
      - name: Test (deterministic suites)
        run: |
          swift test \
            --filter BCICoreTests \
            --filter BCIClassifierTests \
            --filter BCIEEGTests \
            --filter BCICloudBridgeTests \
            --filter BCIVoiceTests \
            --filter AsyncTimeout \
            --skip MindMonitorOSCStreamTests
        # MindMonitorOSCStreamTests binds a real UDP socket on a FIXED high port
        # (57182–57186, 0.0.0.0) and waits on a 1–3s stale watchdog — a genuine
        # collision/flake risk on a headless runner. The OSC *decode* logic is
        # covered socket-free by MuseOSCDecoderTests / MindMonitorDecoderTests,
        # which still run. Run the socket integration test locally.

      # The step above names five targets. The package declares nine, and the
      # app-level fail-closed, runtime-presentation, cancellation, and headless
      # runtime-factory regressions live in two it never selected:
      # NeuralComposeAppTests (116 tests) and DialecticSessionTests (5).
      #
      # Assert they are discoverable before running them. A `--filter` that
      # matches nothing exits 0, so a renamed, moved, or emptied target would
      # otherwise turn into another green step that ran nothing.
      - name: Assert A2 suites are discoverable
        run: |
          swift test list > /tmp/neuralcompose-tests.txt

          # Sentinel classes, one per target.
          grep -q "AppViewModelRuntimeFailClosedTests" /tmp/neuralcompose-tests.txt \
            || { echo "::error::AppViewModelRuntimeFailClosedTests not discoverable"; exit 1; }
          grep -q "RuntimeFactoryClaudeResolutionTests" /tmp/neuralcompose-tests.txt \
            || { echo "::error::RuntimeFactoryClaudeResolutionTests not discoverable"; exit 1; }

          # Sentinels alone would still pass if the rest of a target vanished,
          # so floor each target's discovered count too. Floors are set below
          # the current 116/5 so ordinary test additions never trip them.
          app=$(grep -c '^NeuralComposeAppTests\.' /tmp/neuralcompose-tests.txt)
          session=$(grep -c '^DialecticSessionTests\.' /tmp/neuralcompose-tests.txt)
          echo "discovered: NeuralComposeAppTests=$app DialecticSessionTests=$session"
          [ "$app" -ge 100 ] \
            || { echo "::error::NeuralComposeAppTests discovered $app, expected >= 100"; exit 1; }
          [ "$session" -ge 5 ] \
            || { echo "::error::DialecticSessionTests discovered $session, expected >= 5"; exit 1; }

      # RuntimeIdentityPresentationTests is deliberately NOT asserted here: it
      # arrives with PR #32. Add it as a third sentinel when that lands, so the
      # guard stays true at every revision rather than failing on this base.
      - name: Test (A2 app and session suites)
        run: |
          swift test \
            --filter NeuralComposeAppTests \
            --filter DialecticSessionTests

  # The Python contract suites had no CI at all until now, which is how a test
  # importing an uncommitted module (neuralcompose_eeg.structured_state) reached
  # a pull request unnoticed: build-and-test above is Swift-only.
  #
  # Linux, not macOS: nothing here is platform-specific, and the runner is both
  # cheaper and faster. The one Apple-only suite is excluded by name below.
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: NeuralComposeEEG/requirements.txt

      - name: Install Python dependencies
        run: |
          # CPU wheel explicitly: the default Linux torch pulls a ~800MB CUDA
          # build for a runner with no GPU. Installed first so the pinned
          # requirements below see torch>=2.0 as already satisfied.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r NeuralComposeEEG/requirements.txt
          # pandas is a Tests/eval harness dependency only (session capture
          # frames); deliberately not a NeuralComposeEEG requirement.
          # pytest is required, not stylistic: most Tests/eval modules are bare
          # `def test_*` functions with no unittest.TestCase and no __main__
          # runner, so `python -m unittest` collects ZERO of them and exits 0.
          pip install pandas pytest

      # Offline scientific package: canonical dataset contracts, capture
      # manifests, and the structured-state shadow bridge. Discovered rather
      # than enumerated so new contract suites are picked up automatically.
      - name: Test (NeuralComposeEEG contracts)
        run: |
          PYTHONPATH=NeuralComposeEEG/src \
            python -m unittest discover -s NeuralComposeEEG/tests -t . --verbose

      # pytest, because Tests/eval mixes harness styles: unittest.TestCase,
      # bare `def test_*` with a __main__ runner, and bare `def test_*` with no
      # runner at all. pytest collects all of them; `python -m unittest` skips
      # most silently and still reports OK, so it cannot gate this directory.
      #
      # test_joint_embedding.py imports mlx.core (Apple Silicon only) and would
      # fail collection here — run it locally.
      - name: Test (eval contract suites)
        run: |
          pytest Tests/eval -v \
            --ignore=Tests/eval/test_joint_embedding.py
